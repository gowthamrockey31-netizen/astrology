<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AstroDashaCare">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AstroDashaCare</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;padding:0;background:#050914;overflow:hidden;">
  <!-- Loading screen shown while Flutter initializes -->
  <div id="loading" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#050914 0%,#07131F 50%,#0B1220 80%,#050914 100%);z-index:999;">
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { opacity:0.6; } 50% { opacity:1; } }
    </style>
    <div style="width:48px;height:48px;border:3px solid rgba(212,175,55,0.2);border-top-color:#FFD86B;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
    <p style="margin-top:20px;font-family:'Segoe UI',sans-serif;font-size:13px;color:#FFD86B;letter-spacing:1.5px;animation:pulse 2s ease-in-out infinite;">ASTRODASHACARE</p>
  </div>
  <script>
    function dismissLoading() {
      var el = document.getElementById('loading');
      if (el) {
        el.style.transition = 'opacity 0.4s ease-out';
        el.style.opacity = '0';
        setTimeout(function() {
          if (el && el.parentNode) {
            el.remove();
          }
          document.body.style.overflow = 'auto';
        }, 400);
      }
    }

    // 1. Flutter native first-frame event
    window.addEventListener('flutter-first-frame', dismissLoading);

    // 2. DOM observer for Flutter element attachment
    var observer = new MutationObserver(function(mutations, obs) {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane') || document.querySelector('canvas')) {
        obs.disconnect();
        // Give Flutter a brief tick to paint the first frame
        setTimeout(dismissLoading, 200);
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // 3. Safety fallback timer so loading screen never hangs permanently
    setTimeout(dismissLoading, 3500);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
