version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: always
    environment:
      - MONGO_URI=mongodb://mongo:27017
    depends_on:
      - mongo
    ports:
      - "8000:8000"

  mongo:
    image: mongo:6.0
    restart: always
    volumes:
      - mongo_data:/data/db

  web:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ../build/web:/var/www/astrodashacare/web:ro
      - ../AstroDashaCare.apk:/var/www/astrodashacare/downloads/AstroDashaCare.apk:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  mongo_data:

