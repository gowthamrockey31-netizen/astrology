server {
    listen 80;
    server_name _;

    # Root directory for Flutter Web static files
    root /var/www/astrodashacare/web;
    index index.html;

    # Gzip Compression for fast delivery of Flutter JS/WASM
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/ttf font/otf application/wasm;

    # Serve Android APK downloads directly
    location /download/ {
        alias /var/www/astrodashacare/downloads/;
        autoindex off;
        add_header Content-Disposition 'attachment';
    }

    # Reverse proxy API requests to Python FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Single Page Application (SPA) routing for Flutter Web
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|wasm|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}

